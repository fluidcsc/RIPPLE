<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ripple Grove Coffee – Contact</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="contact-page">

<a class="skip-link" href="#main-content">Skip to main content</a>
<div id="navbar-container"></div>

<main id="main-content">
<section class="page-section contact-section">
  <div class="container">

    <div class="one-col-grid">

      <form id="contactForm" class="ripple-card contact-form" 
            action="https://formspree.io/f/mgaeqdvr" 
            method="POST">

      <div class="ripple-copy">
        <h2 class="eyebrow">Contact Us</h2>
        <p class="ripple-text">We’d love to hear from you — collaborations, bookings, questions, or community ideas.</p>
      </div>  

        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <div class="form-cta">
          <button class="ripple-btn" type="submit">Send Message</button>
          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </div>

      </form>

    </div>

  </div>
</section>
</main>

<div id="footer-placeholder"></div>

<script>
  fetch("footer.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("footer-placeholder").innerHTML = data;

      // Run smart email logic AFTER footer loads
      if (typeof setSmartEmailLink === "function") {
        setSmartEmailLink();
      }
    });

  const contactForm = document.getElementById("contactForm");
  const formStatus = document.getElementById("form-status");

  if (contactForm && formStatus) {
    contactForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const submitButton = contactForm.querySelector("button[type='submit']");
      const originalText = submitButton.textContent;

      submitButton.disabled = true;
      submitButton.textContent = "Sending...";
      formStatus.textContent = "";
      formStatus.classList.remove("success", "error");

      try {
        const response = await fetch(contactForm.action, {
          method: "POST",
          body: new FormData(contactForm),
          headers: {
            Accept: "application/json"
          }
        });

        if (response.ok) {
          formStatus.textContent = "Thanks! Your message has been sent.";
          formStatus.classList.add("success");
          contactForm.reset();
        } else {
          throw new Error("Submission failed");
        }
      } catch (error) {
        formStatus.textContent = "There was a problem sending your message. Please email hello@ripplegrovecoffee.uk directly.";
        formStatus.classList.add("error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = originalText;
      }
    });
  }
</script>

<script src="script.js"></script>
<script src="load-navbar.js"></script>

</body>
</html>
