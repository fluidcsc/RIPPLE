name: Validate HTML & CSS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install HTML validator
      run: npm install -g html-validate
    
    - name: Install CSS validator
      run: npm install -g stylelint stylelint-config-standard
    
    - name: Validate HTML files
      run: |
        for file in *.html; do
          echo "Validating $file..."
          html-validate "$file" || true
        done
    
    - name: Create stylelint config
      run: |
        echo '{
          "extends": "stylelint-config-standard",
          "rules": {
            "no-descending-specificity": null
          }
        }' > .stylelintrc.json
    
    - name: Validate CSS
      run: stylelint "*.css" --allow-empty-input || true
    
    - name: Check for common HTML issues
      run: |
        echo "Checking for unclosed tags and common issues..."
        grep -n "<br>" *.html || echo "No <br> tags found (good!)"
        grep -n "javascript:" *.html || echo "No inline javascript: links found (good!)"
